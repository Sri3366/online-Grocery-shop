<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Us</title>
    <link rel="stylesheet" href="{% static 'css/contact.css' %}">
</head>
<body>

{% include 'navigation.html' %}

<div class="container">
    <div class="innerwrap">

        <section class="section1 clearfix">
            <div class="textcenter">
                <h1 class="shtext">Contact Us</h1>
                <span class="seperator"></span>
                <span class="shtext">Drop Us a Mail</span>
            </div>
        </section>

        <section class="section2 clearfix">
            <div class="col2 column1 first">
                <div class="sec2map" style="overflow:hidden; height:700px; width:100%; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08);">
                    <iframe 
                        width="100%" 
                        height="100%" 
                        frameborder="0" 
                        style="border:0; min-height: 700px;" 
                        src="https://maps.google.com/maps?q=Bantumilli,%20Andhra%20Pradesh,%20India&t=&z=14&ie=UTF8&iwloc=&output=embed" 
                        allowfullscreen>
                    </iframe>
                </div>
            </div>

            <div class="col2 column2 last">
                <div class="sec2innercont">
                    <div class="sec2addr">
                        <p>HN. 2-/61, Bantumilli, Krishna District, Andhra Pradesh. Pincode: 521324.</p>
                        <p><span class="collig">Phone :</span> 7993910966 </p>
                        <p><span class="collig">Email :</span> srivenkatchigurusetti3@gmail.com </p>
                    </div>
                </div>

                <div class="sec2contactform">
                    <h3 class="sec2frmtitle">Want to Know More?? Drop Us a Mail</h3>
                    <form action="" method="POST">
                        {% csrf_token %}
                        <div class="clearfix">
                            <input class="col2 first" type="text" name="firstname" placeholder="First Name" required>
                            <input class="col2 last" type="text" name="lastname" placeholder="Last Name" required>
                        </div>
                        <div class="clearfix">
                            <input class="col2 first" type="email" name="email" placeholder="Email Address" required>
                            <input class="col2 last" type="text" name="contact" placeholder="Contact Number">
                        </div>
                        <div class="clearfix">
                            <textarea name="message" id="message" cols="30" rows="7" placeholder="Your message here..." required></textarea>
                        </div>
                        <div class="clearfix">
                            <input type="submit" value="Send Message">
                        </div>
                    </form>
                </div>
            </div>
        </section>

    </div>
</div>

</body>
</html>
