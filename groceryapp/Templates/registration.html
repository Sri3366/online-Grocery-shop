{% load static %}
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    function checkpass()
    {
        if(document.signup.password.value != document.signup.cpwd.value)
        {
            alert('Password and Repeat Password field does not match');
            document.signup.cpwd.focus();
            return false;
        }
        return true;
    }
    </script>
</head>
<body>
{% include 'navigation.html' %}
<hr class="mt-0">

<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10">
            
            <div class="card shadow border-0 rounded-3 bg-white">
                <div class="card-body p-4 p-md-5">
            
                    <h5 class="fs-4 text-dark pb-2 mb-4" style="border-bottom: 2px solid orange; font-weight: 500;">
                        Create an Account
                    </h5>
                    
                    <form method="POST" name="signup" onsubmit="return checkpass();" enctype="multipart/form-data" class="m-0">
                        {% csrf_token %}
                        
                        <div class="row g-3 mb-4">
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">First Name</label>
                                    <input type="text" name="fname" placeholder="Enter First Name" class="form-control py-2 px-3 bg-white text-dark shadow-none border" style="font-size: 14px; border-radius: 6px;" pattern="[A-Za-z]+" required>
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Last Name</label>
                                    <input type="text" name="lname" placeholder="Enter Last Name" class="form-control py-2 px-3 bg-white text-dark shadow-none border" style="font-size: 14px; border-radius: 6px;" pattern="[A-Za-z]+" required>
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Email ID</label>
                                    <input type="email" name="email" placeholder="Email Address" class="form-control py-2 px-3 bg-white text-dark shadow-none border" style="font-size: 14px; border-radius: 6px;" required>
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Contact</label>
                                    <input type="text" name="mobile" placeholder="Contact Number" class="form-control py-2 px-3 bg-white text-dark shadow-none border" style="font-size: 14px; border-radius: 6px;" required>
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Password</label>
                                    <input type="password" name="password" placeholder="Enter Password" class="form-control py-2 px-3 bg-white text-dark shadow-none border" style="font-size: 14px; border-radius: 6px;" required>
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Confirm Password</label>
                                    <input type="password" name="cpwd" placeholder="Enter Password Again" class="form-control py-2 px-3 bg-white text-dark shadow-none border" style="font-size: 14px; border-radius: 6px;" required>
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-12">
                                <div class="form-group">
                                    <label class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Upload PIC</label>
                                    <input type="file" name="image" class="form-control py-2 px-3 bg-white text-dark shadow-none border" style="font-size: 14px; border-radius: 6px;">
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-12">
                                <div class="form-group">
                                    <label class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Address</label>
                                    <textarea name="address" rows="3" class="form-control py-2 px-3 bg-white text-dark shadow-none border" placeholder="Full Address" style="font-size: 14px; border-radius: 6px; resize: vertical;" required></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-start pt-2">
                            <button type="submit" class="btn btn-primary px-4 py-2 text-capitalize fw-medium border-0" style="background-color: #0d6efd; border-radius: 6px; font-size: 14px;">
                                Submit
                            </button>
                        </div>
                    </form>
                    
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
