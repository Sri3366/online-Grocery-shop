<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile</title>
</head>
<body>
{% include 'navigation.html' %}

<div class="card shadow border-0 m-4 rounded-3">
    <div class="card-body p-4 p-md-5">
        
        <h5 class="fs-4 text-danger pb-2 mb-4" style="border-bottom: 2px solid orange; font-weight: 500;">
            My Profile
        </h5>

        <div class="container-fluid p-0">
            <form method="POST" enctype="multipart/form-data" class="m-0">
                {% csrf_token %}
                
                <div class="row g-4 mb-4">
                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">First Name</label>
                            <input type="text" name="fname" placeholder="Enter First Name" class="form-control py-2 px-3 bg-white text-dark border" pattern="[A-Za-z]+" value="{{ data.user.first_name }}" style="font-size: 14px; border-radius: 6px;">
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Last Name</label>
                            <input type="text" name="lname" placeholder="Enter Last Name" class="form-control py-2 px-3 bg-white text-dark border" pattern="[A-Za-z]+" value="{{ data.user.last_name }}" style="font-size: 14px; border-radius: 6px;">
                        </div>
                    </div>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Email ID</label>
                            <input type="email" name="email" readonly placeholder="Email Address" required class="form-control py-2 px-3 bg-light text-muted border shadow-none" value="{{ data.user.email }}" style="font-size: 14px; border-radius: 6px;">
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Contact</label>
                            <input type="text" name="mobile" placeholder="Contact Number" required class="form-control py-2 px-3 bg-white text-dark border" value="{{ data.mobile }}" style="font-size: 14px; border-radius: 6px;">
                        </div>
                    </div>
                </div>

                <div class="row g-4 mb-4 align-items-center">
                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">User PIC</label>
                            <input type="file" name="image" class="form-control py-2 px-3 bg-white text-dark border" style="font-size: 14px; border-radius: 6px;">
                        </div>
                    </div>
                    <div class="col-12 col-md-6 d-flex align-items-center justify-content-start pt-2 pt-md-0">
                        <div class="form-group m-0">
                            {% if data.image %}
                                <img src="{{ data.image.url }}" class="rounded shadow-sm border" style="width: 70px; height: 75px; object-fit: cover;" alt="Profile Picture">
                            {% else %}
                                <img src="{% static 'images/user_Avatar.png' %}" class="rounded shadow-sm border" style="width: 70px; height: 75px; object-fit: cover;" alt="Fallback Placeholder Avatar">
                            {% endif %}
                        </div>
                    </div>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-12">
                        <div class="form-group">
                            <label class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Address</label>
                            <textarea name="address" class="form-control py-2 px-3 bg-white text-dark border" rows="3" placeholder="Full Address" style="font-size: 14px; border-radius: 6px; resize: vertical;">{{ data.address }}</textarea>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-start pt-2">
                    <button type="submit" class="btn btn-primary px-4 py-2 border-0" style="background-color: #0d6efd; border-radius: 6px; font-size: 14px; font-weight: 500;">
                        Submit
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
