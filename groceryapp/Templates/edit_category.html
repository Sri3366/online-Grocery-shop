{% extends 'admin_base.html' %}
{% block main %}

<div class="card border-0 shadow-sm rounded-3 bg-white">
    <div class="card-body p-4">
        <h5 class="fs-4 text-dark mb-4 pb-2" style="border-bottom: 2px solid orange; font-weight: 500;">Update Category</h5>
        <div class="container-fluid">
            <form action="" method="post" enctype="multipart/form-data" class="mt-2">
                {% csrf_token %}
                <div class="form-row">
                    <div class="col-12 mb-4">
                        <div class="form-group">
                            <label for="categoryNameInput" class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Category Name</label>
                            <input type="text" id="categoryNameInput" name="name" class="form-control value={{category.name}} py-2 px-3 bg-white text-dark shadow-none border" placeholder="Category Name" >
                        </div>
                    </div>
                </div>
                <input type="submit" value="submit" class="m-2 px-3 btn btn-primary">
            </form>
        </div>
    </div>
</div>

    {% endblock %}
