<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

{% include 'navigation.html' %}

<div class="container py-5">
    <div class="card shadow border-0 rounded-3 mx-auto" style="max-width: 1000px;" id="feedbackform">
        <div class="card-body p-4 p-md-5">
            
            <h4 class="pb-2 fw-semibold text-success mb-4" style="border-bottom: 2px solid #ffc107; font-size: 1.25rem;">
                Feedback Form
            </h4>
            
            <form method="post" name="feedback">
                {% csrf_token %}
                
                <div class="row g-3">
                    
                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label for="fname" class="form-label text-dark small fw-medium mb-1">First Name</label>
                            <input type="text" name="fname" id="fname" placeholder="Enter First Name" value="{{user.user.first_name}}" readonly class="form-control bg-light border-secondary-subtle py-2">
                        </div>
                    </div>
                    
                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label class="form-label text-dark small fw-medium mb-1">Last Name</label>
                            <input type="text" name="lname" value="{{user.user.last_name}}" placeholder="Enter Last Name" readonly class="form-control bg-light border-secondary-subtle py-2">
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label class="form-label text-dark small fw-medium mb-1">Email ID</label>
                            <input type="email" name="email" placeholder="Email Address" value="{{user.user.username}}" readonly class="form-control bg-light border-secondary-subtle py-2">
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label for="contact" class="form-label text-dark small fw-medium mb-1">Contact</label>
                            <input type="text" name="mobile" id="contact" placeholder="Contact Number" value="{{user.mobile}}" readonly required class="form-control bg-light border-secondary-subtle py-2">
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="form-group">
                            <label class="form-label text-dark small fw-medium mb-1">Write your feedback</label>
                            <textarea name="feedback" class="form-control border-secondary-subtle py-2" rows="3" placeholder="Write your feedback" required></textarea>
                        </div>
                    </div>
                    
                </div>

                <div class="mt-4 pt-1">
                    <button type="submit" class="btn btn-primary px-4 py-2 fw-medium shadow-sm text-capitalize" style="background-color: #0d6efd; border: none; border-radius: 5px;">
                        send feedback
                    </button>
                </div>
                
            </form>
        </div>
    </div>
</div>

</body>
</html>
