<section class="payment_method">
  <h2 class="ship_head">Scan & Pay via UPI</h2>
  <div class="card_info">
    <form action="" method="post" enctype="multipart/form-data">
      {% csrf_token %}
      
      <div style="text-align: center; margin-bottom: 15px;">
         <img class="qr_code" src="{% static 'images/phonepe_qr.png' %}" alt="PhonePe QR Code" style="width: 200px; height: auto;" />
         <p style="color: #888; font-size: 13px; margin-top: 5px;">Chigurusetti Sri Venkat</p>
      </div>

      <div class="upload_section" style="margin: 20px 0; text-align: center;">
         <label style="display: block; font-weight: bold; margin-bottom: 8px;">Upload Payment Screenshot:</label>
         <input type="file" name="screenshot" accept="image/*" required style="padding: 10px; border: 1px dashed #ccc; width: 80%;" />
      </div>

      <button type="submit" class="confirm_btn" style="background-color: #28a745; width: 100%;">Confirm Payment & Order</button>
    </form>
  </div>
</section>
