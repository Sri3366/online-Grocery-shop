<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grocery Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

{% include 'navigation.html' %}

<div class="container py-5">
    <div class="card shadow border-0 rounded-3 max-width-container mx-auto" style="max-width: 1000px;">
        <div class="card-body p-4 p-md-5">
            
            <h4 class="pb-2 fw-semibold text-success mb-4" style="border-bottom: 2px solid #ffc107; font-size: 1.25rem;">
                Confirm Booking Details
            </h4>
            
            <form method="post" name="booking">
                {% csrf_token %}
                
                <div class="row g-3">
                    
                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label for="fname" class="form-label text-dark small fw-medium mb-1">First Name</label>
                            <input type="text" name="fname" id="fname" placeholder="Enter First Name" value="{{user.user.first_name}}" readonly class="form-control bg-light border-secondary-subtle py-2" pattern="[A-Za-z]+">
                        </div>
                    </div>
                    
                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label class="form-label text-dark small fw-medium mb-1">Last Name</label>
                            <input type="text" name="lname" value="{{user.user.last_name}}" placeholder="Enter Last Name" readonly class="form-control bg-light border-secondary-subtle py-2" pattern="[A-Za-z]+">
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label class="form-label text-dark small fw-medium mb-1">Email ID</label>
                            <input type="email" name="email" placeholder="Email Address" value="{{user.user.username}}" readonly required class="form-control bg-light border-secondary-subtle py-2">
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label for="contact" class="form-label text-dark small fw-medium mb-1">Contact</label>
                            <input type="text" name="mobile" id="contact" placeholder="Contact Number" value="{{user.mobile}}" readonly required class="form-control bg-light border-secondary-subtle py-2">
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label class="form-label text-dark small fw-medium mb-1">Delivery Address</label>
                            <textarea name="address" class="form-control bg-light border-secondary-subtle py-2" rows="1" placeholder="Full Address" readonly style="resize: none;">{{user.address}}</textarea>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label class="form-label text-secondary small fw-medium mb-1">Total Base Price (Rs.)</label>
                            <input type="text" class="form-control bg-light border-secondary-subtle py-2 text-decoration-line-through text-muted" value="{{total|floatformat:2}}" readonly>
                        </div>
                    </div>

                    <div class="col-12 col-md-6 offset-md-6">
                        <div class="form-group">
                            <label class="form-label text-danger small fw-medium mb-1">Discount Savings (Rs.)</label>
                            <input type="text" class="form-control bg-light border-danger-subtle text-danger py-2 fw-medium" value="- {{deduction|floatformat:2}}" readonly>
                        </div>
                    </div>
                    
                    <div class="col-12 col-md-6 offset-md-6">
                        <div class="form-group">
                            <label class="form-label text-success small fw-bold mb-1">Total Payable Price (Rs.)</label>
                            <input type="text" name="total" class="form-control bg-white border-success text-success py-2 fw-bold fs-5 shadow-sm" value="{{discounted|floatformat:2}}" readonly>
                        </div>
                    </div>
                    
                </div>

                <div class="mt-4 pt-2 text-end">
                    <button type="submit" class="btn btn-success px-5 py-2.5 fw-bold shadow-sm rounded-pill fs-6">
                        Proceed to Payment
                    </button>
                </div>
                
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
