{% extends 'admin_base.html' %}
{% block main %}

<div class="card shadow">
    <div class="card-body">
        <h5 class="fs-4 text-dark mb-4 pb-2" style="border-bottom: 2px solid #ff9800; font-weight: 500;">Edit Product</h5>
        <div class="container-fluid">
            <form action="" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label for="productCategorySelect" class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Product Category</label>
                            <select id="productCategorySelect" name="category" class="form-select py-2 px-3 bg-white text-dark shadow-none border" style="font-size: 14px; border-color: #dee2e6; border-radius: 6px;" required>
                                <option value="">Choose Category</option>
                                {% for i in category %}
                                <option value="{{i.id}}" {% if i.id == product.category.id %}selected{% endif %}>{{i.name}}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="col-sm-6">
                        <div class="form-group">
                            <label for="productNameInput" class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Product Name</label>
                            <input type="text" id="productNameInput" name="name" class="form-control" value="{{product.name}}" placeholder="Category Name">
                        </div>
                    </div>

                    <div class="col-sm-6">
                        <div class="form-group">
                            <label for="productPriceInput" class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Product Price</label>
                            <input type="text" id="productPriceInput" name="price" class="form-control" value="{{product.price}}" placeholder="Product Price">
                        </div>
                    </div>

                    <div class="col-sm-6">
                        <div class="form-group">
                            <label for="productDiscountInput" class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Discount</label>
                            <input type="text" id="productDiscountInput" name="discount" class="form-control" value="{{product.discount}}" placeholder="Apply Discount">
                        </div>
                    </div>

                    <div class="col-sm-5">
                        <div class="form-group">
                            <label for="productImageInput" class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Product Image</label>
                            <input type="file" id="productImageInput" name="image" class="form-control">
                        </div>
                    </div>
                   <div class="col-sm-1 d-flex align-items-center justify-content-center">
                        {% if product.image %}
                    <img src="{{product.image.url}}" style="width:100%; height:60px; object-fit: cover;" class="border rounded">
                        {% else %}
                    <small class="text-muted text-center" style="font-size: 11px; line-height: 1.2;">No Image Yet</small>
                        {% endif %}
                    </div>

                    <div class="col-sm-6">
                        <div class="form-group">
                            <label  for="productDescriptionInput" class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Description</label>
                            <textarea name="desc" id="productDescriptionInput" class="form-control" placeholder="write description here">{{product.description}}</textarea>
                        </div>
                    </div>
                </div>
                <input type="submit" value="Submit" class="m-2 px-3 btn btn-primary">
            </form>
        </div>
    </div>
</div>

{% endblock %}
