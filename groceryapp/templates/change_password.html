<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password</title>
</head>
<body>
{% include 'navigation.html' %}

<script type="text/javascript">
    function checkpass() {
        if(document.changepassword.newpassword.value != document.changepassword.confirmpassword.value) {
            alert('New Password and Confirm Password field does not match');
            document.changepassword.confirmpassword.focus();
            return false;
        }
        return true;
    }
</script>

<div class="card shadow border-0 m-4 rounded-3">
    <div class="card-body p-4 p-md-5">
        
        <h5 class="fs-4 text-danger pb-2 mb-4" style="border-bottom: 2px solid orange; font-weight: 500;">
            Change Password
        </h5>

        <div class="container-fluid p-0">
            <form method="POST" name="changepassword" onsubmit="return checkpass();" class="m-0">
                {% csrf_token %}
                
                <div class="row mb-4">
                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Current Password</label>
                            <input type="password" name="currentpassword" id="currentpassword" placeholder="Enter Current Password" class="form-control py-2 px-3 bg-white text-dark border" required style="font-size: 14px; border-radius: 6px;">
                        </div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">New Password</label>
                            <input type="password" name="newpassword" placeholder="Enter New Password" class="form-control py-2 px-3 bg-white text-dark border" required style="font-size: 14px; border-radius: 6px;">
                        </div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label class="form-label text-secondary fw-medium mb-2" style="font-size: 14px;">Confirm New Password</label>
                            <input type="password" name="confirmpassword" id="confirmpassword" placeholder="Enter New Password Again" class="form-control py-2 px-3 bg-white text-dark border" required style="font-size: 14px; border-radius: 6px;">
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-start pt-2">
                    <button type="submit" class="btn btn-primary px-4 py-2 border-0" style="background-color: #0d6efd; border-radius: 6px; font-size: 14px; font-weight: 500;">
                        Submit
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
